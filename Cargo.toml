[package]
name = "ucenter_connector"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Reusable async Rust client for Discuz! UCenter RESTful API"
license = "MIT"
repository = "https://github.com/AI-Hobbyist/ucenter_integrate_rs"

[dependencies]
base64 = "0.22"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
